<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar - MusicBox</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav id="navbar"></nav>

  <main>
    <div class="card card-narrow">
      <h1>Entrar</h1>

      <div id="msg" class="message"></div>

      <form id="loginForm">
        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="voce@email.com">

        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="Sua senha">

        <button type="submit" class="btn-primary" id="submitBtn">Entrar</button>
      </form>

      <p class="form-footer">Ainda não tem conta? <a href="register.html">Criar conta</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message show ${type}`;
    }

    // Se já estiver logado, manda direto pra home
    if (getSession()) {
      window.location.href = 'index.html';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Entrando...';

      const { data } = await apiRequest('/users/login', 'POST', { email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';

      if (data && data.success) {
        saveSession(data.user);
        window.location.href = 'index.html';
      } else {
        showMessage((data && data.message) || 'Não foi possível entrar.', 'error');
      }
    });
  </script>
</body>
</html>
