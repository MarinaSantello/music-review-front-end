<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta - Music Review</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <nav id="navbar"></nav>

  <main>
    <div class="card card-narrow">
      <h1>Criar conta</h1>

      <div id="msg" class="message"></div>

      <form id="registerForm">
        <label for="name">Nome</label>
        <input type="text" id="name" required placeholder="Seu nome">

        <label for="email">E-mail</label>
        <input type="email" id="email" required placeholder="voce@email.com">

        <label for="password">Senha</label>
        <input type="password" id="password" required placeholder="Mín. 6 caracteres, com maiúscula, minúscula, número e símbolo">

        <button type="submit" class="btn-primary" id="submitBtn">Criar conta</button>
      </form>

      <p class="form-footer">Já tem conta? <a href="login.html">Entrar</a></p>
    </div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('registerForm');
    const msg = document.getElementById('msg');
    const submitBtn = document.getElementById('submitBtn');

    function showMessage(text, type) {
      msg.textContent = text;
      msg.className = `message show ${type}`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Criando...';

      const { data } = await apiRequest('/users/create', 'POST', { name, email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Criar conta';

      if (data && data.success) {
        showMessage('Conta criada com sucesso! Redirecionando para o login...', 'success');
        setTimeout(() => window.location.href = 'login.html', 1200);
      } else {
        showMessage((data && data.message) || 'Não foi possível criar a conta.', 'error');
      }
    });
  </script>
</body>
</html>
